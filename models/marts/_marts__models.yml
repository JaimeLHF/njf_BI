version: 2

models:
  - name: fct_faturamento
    description: >
      Faturamento no grão de item de nota fiscal de saída, de 2021-01 a 2026-08.
      Não filtra natureza da operação: `gera_financeiro`, `movimenta_estoque` e
      `eh_devolucao_heuristica` ficam expostos para o consumidor decidir. Sem
      filtro, o total mistura venda com remessa, bonificação e devolução.
    tests:
      - chave_unica:
          arguments:
            colunas: [id_nota_saida_item]
    columns:
      - name: id_nota_saida_item
        description: "Chave. Um item de NF de saída."
        tests: [not_null]
      - name: id_nota_saida
        tests: [not_null]
      - name: id_cliente
        description: "Cliente da nota. O pedido não tem cliente direto."
        tests: [not_null]
      - name: data_emissao
        tests: [not_null]
      - name: valor_liquido
        tests: [not_null]
      - name: gera_financeiro
        description: >
          Vem de dim_tipo_nf_saida.flag_gera_financeiro. Só 158 dos 412 tipos
          geram financeiro. É este o filtro para "faturamento de verdade".
      - name: eh_devolucao_heuristica
        description: >
          Heurística de texto sobre descricao_tipo_nf, não classificação fiscal.
          Substituir por lista de CFOPs quando a fiscal confirmar.

  - name: fct_ordem_producao
    description: >
      Ordens de fabricação com prazo medido contra a conclusão real, derivada do
      último apontamento de produção. Não usar data_fim para prazo: é
      planejamento, anterior ao último apontamento em 98,7% das ordens.
    tests:
      - chave_unica:
          arguments:
            colunas: [id_ordem_fabricacao]
    columns:
      - name: id_ordem_fabricacao
        description: "Chave. Uma ordem de fabricação."
        tests: [not_null]
      - name: num_ordem
        description: >
          Número da ordem. É por ele que fat_nota_saida_item_pontuacao se junta,
          não pelo id.
        tests: [not_null]
      - name: data_conclusao_real
        description: >
          max(data_apontamento) da ordem, via roteiro. Nula quando a ordem não
          tem nenhum apontamento — ver tem_apontamento.
      - name: atraso_dias
        description: >
          data_conclusao_real menos data_prevista_fim. Positivo = atrasou.
          Nulo quando falta uma das duas datas.
      - name: no_prazo
        description: "data_conclusao_real <= data_prevista_fim."
      - name: atraso_dias_por_data_fim
        description: >
          O cálculo ingênuo, com data_fim. Está aqui só para a diferença contra
          atraso_dias ficar visível. Não usar como indicador.
      - name: quantidade_refugada_nao_confiavel
        description: >
          Renomeada de propósito. Maior que a produzida em 54.439 de 54.494
          ordens: semântica não confirmada com o ERP.
      - name: lead_time_dias
        description: >
          data_conclusao_real menos data_abertura. Negativo em 19,9% das ordens
          com apontamento: a abertura não é o começo do processo.
      - name: lead_time_producao_dias
        description: >
          Do primeiro ao último apontamento. Nunca negativo. Mediana de 0 dias —
          a maior parte das ordens tem todo o apontamento no mesmo dia.
      - name: apontamento_antes_da_abertura
        description: >
          Verdadeiro em 24,7% das ordens com apontamento. Onde for verdadeiro,
          lead_time_dias não significa nada.
      - name: tem_apontamento
        description: "Se falso, todas as colunas de prazo real são nulas."

  - name: fct_pedido
    description: >
      Pedidos de venda no grão de item, com carteira em aberto derivada do
      faturamento real via ponte deduplicada — não de quantidade_saldo, que a
      origem nunca baixa. NÃO filtra origem_pedido: 'SIM' são R$ 2,6 bi com 0%
      de conversão em NF e inflam a carteira em 15x se somados junto. Use
      origem_converte_em_nf.
    tests:
      - chave_unica:
          arguments:
            colunas: [id_pedido_item]
    columns:
      - name: id_pedido_item
        description: "Chave. Um item de pedido de venda."
        tests: [not_null]
      - name: id_pedido
        tests: [not_null]
      - name: id_cliente
        description: >
          Vem por dim_estabelecimento: fat_pedido não tem cliente direto.
      - name: quantidade_em_aberto
        description: >
          quantidade - cancelado - faturado, nunca negativa. Só conta como
          faturamento nota que gera financeiro e não é devolução.
      - name: valor_em_aberto
        description: "quantidade_em_aberto x valor_unitario_liquido."
      - name: status_faturamento
        description: >
          cancelado / nao faturado / faturado parcial / faturado total.
        tests:
          - accepted_values:
              arguments:
                values: ['cancelado', 'nao faturado', 'faturado parcial',
                         'faturado total']
      - name: origem_converte_em_nf
        description: >
          Taxa de conversão da origem em nota fiscal acima de 1%, medida do
          próprio dado. Falso para SIM, EXP e ORC — nenhuma delas gerou uma
          única NF em cinco anos. Filtro obrigatório para carteira.
      - name: taxa_conversao_da_origem
        description: "Proporção de itens da origem que viraram NF. PDV: 84,4%."
      - name: dias_ate_primeiro_faturamento
        description: >
          data_primeiro_faturamento menos data_emissao do pedido. Mediana de
          64 dias.
      - name: quantidade_saldo_origem_nao_confiavel
        description: >
          A coluna quantidade_saldo da origem, renomeada. Não é baixada no
          faturamento: 96,6% dos itens com saldo positivo já foram faturados.
          Está aqui só para comparação.
      - name: quantidade_faturada_acima_do_pedido
        description: >
          Excedente onde o faturado passa do pedido menos o cancelado.
          1.190 itens de 379.754.
      - name: flag_quantidade_igual_valor_unitario
        description: >
          Quantidade idêntica ao valor unitário, com quantidade >= 100.
          Assinatura de digitação duplicada. O piso de 100 separa erro de
          coincidência: dos 688 itens onde os dois campos batem, 617 têm
          quantidade < 10 e somam R$ 0,00 mi.
      - name: flag_quantidade_atipica
        description: >
          Quantidade acima de 10x o p99 do próprio item, com piso de 100
          unidades. Fallback do p99: item -> família -> global. O percentil é
          calculado sobre base limpa (quantidade <= 500) para a referência não
          se contaminar com o próprio defeito.
      - name: valor_pedido_plausivel
        description: >
          Negação das duas flags acima, para quem quer o filtro pronto.
          155 itens em 379.754 (0,04%) são implausíveis, R$ 1.626 milhões.
      - name: p99_quantidade_referencia
        description: "O p99 usado na comparação, já visível para auditoria."
      - name: base_referencia_quantidade
        description: "item / familia / global — de onde veio o p99."
